# To better understand this file read this:
# https://docs.ionos.space/docs/github-actions-customization/

name: "Deploy Now: Execute Build"

on:
  workflow_call:
    inputs:
      site-url:
        required: true
        type: string
      branch-id:
        required: true
        type: string

env:
  DEPLOYMENT_FOLDER: out

jobs:
# Please do not rename this job
  build-project:
    name: build NiecheToolbox
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: v22.x

      - name: Install dependencies
        run: npm ci

      # Vor dem Build prüfen statt danach: ein kaputter Typ oder ein rotes
      # Testat soll den Deploy verhindern, nicht erst hinterher auffallen.
      # Die 35 Testdateien liefen bis hierhin nur lokal.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build Node assets
        env:
          CI: true
          CSP_MODE : enforce
          NEXT_PUBLIC_ADS_ENABLED: false
          NEXT_PUBLIC_ADSENSE_CLIENT : ca-pub-4379452218973991
          NEXT_PUBLIC_ANALYTICS_PROVIDER : umami
          NEXT_PUBLIC_UMAMI_SCRIPT_URL : https://cloud.umami.is/script.js
          NEXT_PUBLIC_UMAMI_WEBSITE_ID : 90a65a5b-0e64-4135-82ec-094c0d8e80cc
          GOOGLE_SITE_VERIFICATION : 8EBDaNWwLjSCWpJrGQ_6tYLCGmw_PWU-5dzQujdD_44
          # Bewusst NICHT ${{ inputs.site-url }}: Deploy Now reicht dort den
          # Platzhalter https://IONOS_DEPLOY_NOW_SITE_URL durch und ersetzt ihn
          # erst nach dem Build per `sed` in allen Dateien. Das zerstört den
          # RSC-Payload: Next streamt die JSON-LD-Blöcke als längenpräfigierte
          # Flight-Zeilen (`26:Taec,` = 2796 Bytes). Wird der 33 Zeichen lange
          # Platzhalter danach durch die 24 Zeichen kurze Domain ersetzt,
          # stimmt die Byte-Länge nicht mehr, der Client liest über das
          # Zeilenende hinaus und stirbt mit
          # "Cannot read properties of null (reading 'enqueueModel')" –
          # die Seite hydriert nicht mehr ("This page couldn't load").
          # Die echte Domain gehört deshalb schon in den Build.
          SITE_URL: https://rechnerkiste.app
        run: npm run build

# Please do not touch the following action
      - name: Store deployment content
        uses: ionos-deploy-now/artifact-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: 04bbd989-2b0b-46fb-8310-171dc61de987
          branch-id: ${{ inputs.branch-id }}
          version: ${{ github.sha }}
          folder: ${{ env.DEPLOYMENT_FOLDER }}
          config-file: .deploy-now/NiecheToolbox/config.yaml
          action: upload
